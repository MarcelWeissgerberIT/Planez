<!doctype html>
<!-- Entwickler-Galerie: alle 3D-Bodenfahrzeuge nebeneinander (tools/gallery3d.html?view=side|top|night&work=1) -->
<html><head><meta charset="utf-8"><title>Planez 3D-Galerie</title>
<style>html,body{margin:0;background:#9fb3c8;overflow:hidden}canvas{display:block}</style></head>
<body><script type="module">
import * as THREE from '../js/vendor/three.module.min.js';
import { buildVehicle, vehParts, poseVehicle, STAIRS_3D, carInstances } from '../js/render/vehicles3d.js';
import { servicePoint } from '../js/layout.js';
import { buildAircraft, buildHeli } from '../js/render/model3d.js';
import { AIRLINES, AC_TYPES } from '../js/config.js';
import { stairsGeom, beltDoor } from '../js/acshape.js';
import { jetBridges } from '../js/render/jetbridge.js';
import { STAND_NOSE } from '../js/layout.js';
const q = new URLSearchParams(location.search);
const view = q.get('view') || 'side', work = q.get('work') === '1', night = view === 'night';
const r = new THREE.WebGLRenderer({ antialias: true });
r.setPixelRatio(1);
r.setSize(innerWidth, innerHeight);
r.shadowMap.enabled = true;
r.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const sc = new THREE.Scene();
sc.background = new THREE.Color(night ? 0x0b1220 : 0xb8c8d8);
sc.add(new THREE.HemisphereLight(0xdfeaf5, 0x55606a, night ? 0.25 : 1.1));
const sun = new THREE.DirectionalLight(0xfff3dc, night ? 0.15 : 2.2);
sun.position.set(-3, 6, 4);
sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4 });
sun.shadow.mapSize.set(2048, 2048);
sc.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshLambertMaterial({ color: 0x8d9298 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
sc.add(ground);
const acs = q.get('acs');
if (acs) acs.split(',').forEach((t, i, all) => {
  const al = q.get('al') || Object.keys(AIRLINES).find((k) => !AIRLINES[k].ga) ;
  const m = buildAircraft({ type: t, airline: al });
  // Klappen zeigen: flaps=1 Start, flaps=2 Landung (mit Vorflügeln), spoil=1 Störklappen
  const fs = +(q.get('flaps') || 0);
  for (const [n, on] of [['flapsTo', fs === 1], ['flapsDn', fs === 2], ['slats', fs > 0], ['spoilers', q.get('spoil') === '1']]) { const o = m.getObjectByName(n); if (o) o.visible = on; }
  m.position.set((i - (all.length - 1) / 2) * 1.6, m.userData.H || 0.1, 0);
  m.rotation.y = +(q.get('rot') || 0.6);
  sc.add(m);
});
// Pkw (cars=1): je Bauform ein Auto in Reihe, Farben gemischt wie auf dem Parkplatz
if (q.get('cars')) {
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const kinds = q.get('cars') === 'all' ? ['mini', 'hatch', 'sedan', 'estate', 'suv', 'van', 'pickup'] : q.get('cars') === 'blue' ? ['police', 'ambulance'] : q.get('cars') === 'police' ? ['police', 'policevan'] : null; // cars=all: jede Bauform zweimal
  const n = 14, ci = carInstances(n, rnd, kinds), mx = new THREE.Matrix4();
  for (let i = 0; i < n; i++) {
    mx.makeRotationY(Math.PI / 2 + (i % 2 ? Math.PI : 0));
    mx.setPosition((i % 7 - 3) * 0.16, 0, Math.floor(i / 7) * 0.36 - 0.18);
    ci.set(i, mx);
  }
  ci.update();
  sc.add(ci.group);
}
// Treppe an der Tür (stairsat=TYP): Flugzeug in Nordrichtung, Treppenfahrzeug am Service-Punkt der Simulation
if (q.get('stairsat')) {
  const t = q.get('stairsat'), ac = { id: 'a1', type: t, airline: Object.keys(AIRLINES)[0], x: 0, y: 0, hdg: 0, len: AC_TYPES[t].len };
  const m = buildAircraft(ac);
  m.position.set(0, m.userData.H || 0.1, 0);
  sc.add(m);
  const sp = servicePoint('stairs', ac);
  const v = { id: 's1', type: 'stairs', name: 'stairs 1', x: sp.x, y: sp.y, hdg: sp.hdg, st: 'docked', job: { ac: 'a1' } };
  const vm = buildVehicle(v);
  vm.position.set(v.x, 0, v.y);
  vm.rotation.y = -v.hdg;
  vehParts(vm).top = 0.12;
  for (let i = 0; i < 400; i++) poseVehicle({ acs: [ac], time: 0 }, v, vm, 0.5, 0);
  sc.add(vm);
}
// Bus an der Außenposition (busat=TYP): Flugzeug in Nordrichtung, Vorfeldbus am Service-Punkt „deboard“
// Fluggastbrücke an der Tür (jbat=TYP, jbe=0…1): Position 0 bei x = 20, Flugzeug in Nordrichtung; Szene um den Ursprung verschoben
if (q.get('jbat')) {
  const t = q.get('jbat'), L = AC_TYPES[t].len, X = 20;
  const ac = { id: 'a3', type: t, airline: Object.keys(AIRLINES)[0], x: X, y: STAND_NOSE + L / 2, hdg: -Math.PI / 2, len: L, mode: 'map' };
  const st = { id: 9, x: X, kind: 'contact', built: true, occ: 'a3', bridge: +(q.get('jbe') ?? 1) };
  const off = new THREE.Vector3(-X, 0, -16.2);
  const m = buildAircraft(ac);
  m.position.set(ac.x, m.userData.H || 0.1, ac.y).add(off);
  m.rotation.y = -ac.hdg;
  sc.add(m);
  for (const o of jetBridges({ stands: [st], acs: [ac] })) {
    const vm = buildVehicle(o);
    poseVehicle({ acs: [ac], time: 0 }, o, vm, 0, 0);
    vm.position.set(o.x, 0, o.y).add(off);
    vm.rotation.y = -o.hdg;
    sc.add(vm);
  }
}
if (q.get('busat')) {
  const t = q.get('busat'), ac = { id: 'a2', type: t, airline: Object.keys(AIRLINES)[1], x: 0, y: 0, hdg: -Math.PI / 2, len: AC_TYPES[t].len };
  const m = buildAircraft(ac);
  m.position.set(0, m.userData.H || 0.1, 0);
  m.rotation.y = -ac.hdg;
  sc.add(m);
  const sp = servicePoint('deboard', ac);
  const vm = buildVehicle({ id: 'b9', type: 'bus', name: 'bus 1' });
  vm.position.set(sp.x, 0, sp.y);
  vm.rotation.y = -sp.hdg;
  sc.add(vm);
}
if (q.get('tugat')) {
  // Pushback: Schlepper vor der Nase, Schleppstange am Bugrad
  const t = q.get('tugat'), ac = { id: 'a4', type: t, airline: Object.keys(AIRLINES)[2], x: 0, y: 0, hdg: -Math.PI / 2, len: AC_TYPES[t].len };
  const m = buildAircraft(ac);
  m.position.set(0, m.userData.H || 0.1, 0);
  m.rotation.y = -ac.hdg;
  sc.add(m);
  const sp = servicePoint('push', ac), v = { id: 't9', type: 'tug', name: 'tug 3', x: sp.x, y: sp.y, hdg: sp.hdg, st: 'attached', job: { ac: ac.id, k: 'push' } };
  const vm = buildVehicle(v);
  poseVehicle({ acs: [ac], time: 0 }, v, vm, 0, 0);
  vm.position.set(sp.x, 0, sp.y);
  vm.rotation.y = -sp.hdg;
  sc.add(vm);
}
if (q.get('beltat')) {
  // Förderband an der hinteren Frachttür (wie render/beltloader.js atDoor), Band hochgefahren
  const t = q.get('beltat'), ac = { id: 'a5', type: t, airline: Object.keys(AIRLINES)[3], x: 0, y: 0, hdg: -Math.PI / 2, len: AC_TYPES[t].len };
  const m = buildAircraft(ac);
  m.position.set(0, m.userData.H || 0.1, 0);
  m.rotation.y = -ac.hdg;
  sc.add(m);
  const D = beltDoor(t, ac.len), ANG = 0.45;
  if (D) {
    const fx = Math.cos(ac.hdg), fy = Math.sin(ac.hdg), rx = -fy, ry = fx, dx = Math.cos(ANG), dl = -Math.sin(ANG);
    const a = D.along - dx * D.reach, l = D.lat - dl * D.reach;
    const v = { id: 'b5', type: 'belt', x: fx * a + rx * l, y: fy * a + ry * l, hdg: Math.atan2(fy * dx + ry * dl, fx * dx + rx * dl), top: D.top, lift: +(q.get('lift') ?? 1), st: 'work', dir: +(q.get('dir') ?? -1) };
    const vm = buildVehicle(v);
    poseVehicle({ acs: [ac], time: 0 }, v, vm, 0, +(q.get('t') ?? 0));
    vm.position.set(v.x, 0, v.y);
    vm.rotation.y = -v.hdg;
    sc.add(vm);
  }
}
// Rettungshubschrauber (heli=1): Rotor steht (spin=1: Unschärfe-Scheibe sichtbar)
if (q.get('heli')) {
  const m = buildHeli();
  m.position.set(0, m.userData.H, 0);
  m.rotation.y = +(q.get('rot') || 0.6);
  const rot = m.getObjectByName('rotor');
  rot.rotation.y = 0.4;
  m.getObjectByName('disc').visible = q.get('spin') === '1';
  sc.add(m);
}
const types = q.get('heli') || acs || q.get('cars') || q.get('stairsat') || q.get('busat') || q.get('jbat') || q.get('tugat') || q.get('beltat') ? [] : (q.get('types') || 'tug,baggage,fuel,catering,cleaning,bus,stairs,deice,fire,plow,followme').split(',');
types.forEach((t, i) => {
  const m = buildVehicle({ type: t, id: 'v' + (i * 7 + 3), name: `${t} ${i + 1}` }); // ID und Name: Werbung und Dachnummer
  const col = i % 5, row = Math.floor(i / 5);
  if (types.length > 1) m.position.set((col - 2) * 0.62, 0, (row - 0.5) * 0.62 - (col % 2) * 0.12);
  m.rotation.y = types.length > 1 ? 0.35 : +(q.get('rot') || 0.6);
  const P = vehParts(m);
  if (work) {
    if (P.lift) (P.lift.position.y = 0.07 + 0.11, P.scis.visible = true, P.scis.scale.y = 0.11, P.plat.visible = true);
    if (P.boom) (P.tur.rotation.y = 1.2, P.boom.rotation.z = 0.75, P.bask.rotation.z = -0.75, P.spray.visible = true);
  }
  if (P.ramp) {
    // Treppe: work=1 an der Tür hochgestellt, sonst Fahrstellung
    const { th, len } = stairsGeom(work ? 0.26 : 0.12);
    P.ramp.rotation.z = th;
    P.ramp.scale.x = len / STAIRS_3D.len;
    P.stp.position.set(STAIRS_3D.hinge + Math.cos(th) * len, STAIRS_3D.y + Math.sin(th) * len, 0);
  }
  if (night) { if (P.hl) P.hl.visible = true; if (P.tl) P.tl.visible = true; }
  sc.add(m);
});
const cam = new THREE.PerspectiveCamera(q.get('fov') ? +q.get('fov') : view === 'top' ? 30 : 32, innerWidth / innerHeight, 0.05, 200); // fov=… klein + Kamera weit weg ≈ Kartenprojektion
const one = types.length === 1 || (acs && acs.split(',').length === 1);
if (view === 'top') cam.position.set(0, 4.2, 2.6);
else if (one && acs) cam.position.set(0.9, 0.35, 2.0);
else if (one) cam.position.set(0.25, 0.32, 1.05);
else cam.position.set(0.2, 1.25, 2.9);
if (q.get('cam')) cam.position.set(...q.get('cam').split(',').map(Number)); // eigene Kamera: cam=x,y,z
if (q.get('look')) cam.lookAt(...q.get('look').split(',').map(Number)); // Blickpunkt: look=x,y,z
else cam.lookAt(0, one ? 0.06 : -0.05, 0);
r.render(sc, cam);
window.done = true;
</script></body></html>
